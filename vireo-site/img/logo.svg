<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .logo-text { fill: #5EC4B6; font-family: 'Inter', 'Arial', sans-serif; font-weight: 300; letter-spacing: -2px; }
      .tm { fill: #5EC4B6; font-family: 'Arial', sans-serif; font-size: 24px; font-weight: 400; }
    </style>
  </defs>
  
  <!-- VIREO текст -->
  <text x="60" y="130" class="logo-text" font-size="110">V</text>
  <text x="170" y="130" class="logo-text" font-size="110">I</text>
  <text x="220" y="130" class="logo-text" font-size="110">R</text>
  <text x="340" y="130" class="logo-text" font-size="110">E</text>
  <text x="450" y="130" class="logo-text" font-size="110">O</text>
  
  <!-- О для буквы O (круг с листом) вместо последней буквы -->
  <!-- Нарисуем круг поверх буквы O -->
  <circle cx="505" cy="115" r="62" fill="none" stroke="#5EC4B6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Листок внутри круга -->
  <path d="M 505 53 Q 535 75 505 115 Q 535 155 505 177" fill="none" stroke="#5EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 505 53 Q 475 75 505 115 Q 475 155 505 177" fill="none" stroke="#5EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- TM -->
  <text x="640" y="70" class="tm">TM</text>
</svg>
